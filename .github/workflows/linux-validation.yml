name: Linux Validation (tmp)

# PHASE 4BH: one-shot native Linux validation of the exact 4AQ-4BB working
# tree on the free ubuntu-latest runner. Trigger: push to this temporary
# branch ONLY. No other branch, tag, PR, dispatch, release, artifact,
# deploy or secret is involved. Every step fails the job on error; no
# `|| true`, no continue-on-error, NOT_RUN is never upgraded to PASS.

on:
  push:
    branches: ['tmp/linux-validation-20261013']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-validation:
    name: Linux validation (4AQ-4BB exact tree)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust exactly 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Assert Rust version
        run: |
          rustc --version
          cargo --version
          test "$(rustc --version)" = "rustc 1.97.1 (8bab26f4f 2026-07-14)"

      - name: System deps (OpenSSL for the pre-existing reqwest chain)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Identity of tested code
        # Blob bytes (git-normalized), never working-copy bytes: identical
        # on every platform regardless of line-ending settings. The auditor
        # compares this printout to the 4BH report manifest.
        run: |
          echo "SHA: $(git rev-parse HEAD)"
          echo "PARENT: $(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "b449f780dcd12dce69ceee53fc4c43dc1ae13f26"
          echo "BASELINE-ANCESTOR:"
          git merge-base --is-ancestor bdc4a7aa1ea069af54cc8845d68a3c668ca644fb HEAD
          changed_files="$(git diff --name-only HEAD^ HEAD | sort -u)"
          echo "CHANGED_SINCE_PARENT:"
          printf '%s\n' "$changed_files"
          test "$changed_files" = ".github/workflows/linux-validation.yml"
          echo "BRANCH: $(git rev-parse --abbrev-ref HEAD)"
          test -z "$(git status --short)"
          for f in Cargo.toml Cargo.lock src/bin/v6_preflight.rs src/lib.rs \
            src/inventory.rs src/evidence_log.rs \
            tests/phase4aq_inventory_tests.rs tests/phase4ar_file_identity_tests.rs \
            tests/phase4as_evidence_log_tests.rs tests/phase4bb_windows_hardlinks_tests.rs \
            tests/v6_preflight_manifest.rs \
            .github/workflows/linux-validation.yml \
            $(git ls-files 'src/tests/*.rs'); do
            printf '%s  %s\n' "$(git cat-file -p HEAD:$f | sha256sum | cut -d' ' -f1)" "$f"
          done

      - name: Build lib
        run: cargo build --lib --verbose

      - name: Build v6_preflight binary
        run: cargo build --bin v6_preflight --verbose

      - name: Inventory tests (4AQ; require real symlink execution)
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          cargo test --test phase4aq_inventory_tests --verbose -- --nocapture 2>&1 | tee "$log_file"
          for test_name in \
            q08_symlink_internal_recorded_never_followed \
            q08b_symlink_absolute_with_parent_segment_inside_root_not_external \
            q08c_symlink_target_name_containing_two_dots_inside_root_not_external \
            q09_symlink_external_flagged \
            q10_symlink_chain_and_dangling; do
            if ! grep -Fq "test ${test_name} ... ok" "$log_file"; then
              echo "::error::Critical symlink test missing or failed: ${test_name}"
              exit 1
            fi
          done
          if grep -Fq "NOT_RUN: symlink creation unavailable" "$log_file"; then
            echo "::error::At least one critical symlink scenario was skipped"
            grep -F "NOT_RUN: symlink creation unavailable" "$log_file"
            exit 1
          fi
          rm -f "$log_file"

      - name: File identity tests (4AR)
        run: cargo test --test phase4ar_file_identity_tests --verbose

      - name: Evidence log tests (4AS/4AU)
        run: cargo test --test phase4as_evidence_log_tests --verbose

      - name: Preflight manifest suite
        run: cargo test --test v6_preflight_manifest --verbose

      - name: Preflight unit tests
        run: cargo test --bin v6_preflight --verbose

      - name: Lib inventory unit tests
        run: cargo test --lib inventory --verbose

      - name: Lib evidence_log unit tests
        run: cargo test --lib evidence_log --verbose

      - name: Unix link behavior regression (4BB / w12)
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          cargo test --test phase4bb_windows_hardlinks_tests --verbose -- --nocapture 2>&1 | tee "$log_file"
          if ! grep -Fq "test w12_unix_behavior_unchanged ... ok" "$log_file"; then
            echo "::error::w12 Unix test did not run successfully"
            exit 1
          fi
          if grep -Fq "NOT_RUN: unix legs not compiled on this runner" "$log_file"; then
            echo "::error::Unix behavior leg was marked NOT_RUN on Linux"
            exit 1
          fi
          rm -f "$log_file"

  windows-symlink-validation:
    name: Native Windows symlink validation (w11)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust exactly 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Assert tested commit identity
        shell: bash
        run: |
          echo "SHA: $(git rev-parse HEAD)"
          echo "PARENT: $(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "b449f780dcd12dce69ceee53fc4c43dc1ae13f26"
          git merge-base --is-ancestor bdc4a7aa1ea069af54cc8845d68a3c668ca644fb HEAD
          changed_files="$(git diff --name-only HEAD^ HEAD | sort -u)"
          test "$changed_files" = ".github/workflows/linux-validation.yml"
          test -z "$(git status --short)"

      - name: Native Windows test w11 (must create a real symlink)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logFile = Join-Path $env:TEMP "aether-w11-$env:GITHUB_RUN_ID.log"
          cargo test --test phase4bb_windows_hardlinks_tests w11_symlinks_never_grouped_with_hardlinks --verbose -- --nocapture 2>&1 | Tee-Object -FilePath $logFile
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          $output = Get-Content -Raw -Path $logFile
          if ($output -notmatch 'test w11_symlinks_never_grouped_with_hardlinks \.\.\. ok') {
            throw "w11 did not report a successful test execution"
          }
          if ($output -match 'NOT_RUN: (native Windows walk requires a Windows runner|hardlink creation refused by FS/rights|symlink creation refused \(privileges\))') {
            throw "w11 was skipped or its filesystem prerequisites were unavailable"
          }
          Remove-Item -Force $logFile
