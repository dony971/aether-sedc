name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aether-linux
            ext: ""
          - os: macos-latest
            target: aether-macos
            ext: ""
          - os: windows-latest
            target: aether-windows
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build aether CLI
        run: cargo build --release --bin aether --verbose

      - name: Upload aether CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-cli
          path: target/release/aether${{ matrix.ext }}

      - name: Build aether GUI
        run: cargo build --release --bin aether-gui --verbose

      - name: Upload aether GUI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-gui
          path: target/release/aether-gui${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "See CHANGELOG.md for details." \
            --verify-tag || true

      - name: Upload CLI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in *-cli; do
            base="${dir%-cli}"
            cp "$dir"/* "aether"
            chmod +x "aether"
            mv "aether" "aether-cli-$base"
          done
          gh release upload ${{ github.ref_name }} aether-cli-* --clobber

      - name: Upload GUI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in *-gui; do
            base="${dir%-gui}"
            cp "$dir"/* "aether"
            chmod +x "aether"
            mv "aether" "aether-gui-$base"
          done
          gh release upload ${{ github.ref_name }} aether-gui-* --clobber
