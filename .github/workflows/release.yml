name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build aether CLI
        run: cargo build --release --bin aether --verbose

      - name: Upload aether CLI
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.os }}
          path: target/release/aether${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: ls -R

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in aether-*/aether*; do
            os=$(echo "$file" | cut -d/ -f1 | sed 's/aether-//')
            ext=""
            case "$os" in
              ubuntu-latest) ext="" ;;
              macos-latest)  ext="" ;;
              windows-latest) ext=".exe" ;;
            esac
            cp "$file" "aether-$os$ext"
          done
          gh release upload ${{ github.ref_name }} aether-* --clobber
