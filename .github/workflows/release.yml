name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aether-linux
            ext: ""
          - os: macos-latest
            target: aether-macos
            ext: ""
          - os: windows-latest
            target: aether-windows
            ext: ".exe"

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build aether
        run: cargo build --release --bin aether --verbose
      - name: Upload aether
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/release/aether${{ matrix.ext }}
      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress
      - name: Build Windows setup
        if: matrix.os == 'windows-latest'
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\setup.iss"
      - name: Upload Windows setup
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-setup
          path: installer/AETHER-SEDC-*.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release and Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prepare binaries
          mkdir -p upload
          for dir in aether-*; do
            if [ -d "$dir" ]; then
              base="${dir#aether-}"
              if [ -f "$dir/aether.exe" ]; then
                cp "$dir/aether.exe" "upload/aether-$base.exe"
              elif [ -f "$dir/aether" ]; then
                cp "$dir/aether" "upload/aether-$base"
                chmod +x "upload/aether-$base"
              fi
            fi
          done
          # Include the Windows setup generated by Inno Setup
          # (artifact preserves the installer/ relative path, so search recursively)
          find aether-windows-setup -name "AETHER-SEDC-*.exe" -exec cp {} upload/ \;
          # Create or update release, upload
          gh release create ${{ github.ref_name }} upload/* \
            --title "${{ github.ref_name }}" \
            --notes "Single binary: double-click for GUI, terminal for CLI." \
            --verify-tag || gh release upload ${{ github.ref_name }} upload/* --clobber
