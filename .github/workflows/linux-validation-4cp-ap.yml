          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::$n published invalid BENCH_JSONL data"
            exit 1
          fi
          : > "/tmp/$n.jsonl"
          for line in "${metrics[@]}"; do printf '%s\n' "${line#*BENCH_JSONL:}" >> "/tmp/$n.jsonl"; done
          if ! python3 - "$n" "/tmp/$n.jsonl" <<'PY'
          import json
          import sys

          label, path = sys.argv[1], sys.argv[2]
          rows = [json.loads(line) for line in open(path, encoding="utf-8")]
          reps = [r for r in rows if r.get("record_type") == "repetition"]
