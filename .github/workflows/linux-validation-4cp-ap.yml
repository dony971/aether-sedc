name: Linux Validation (temporary, 4CP-AQ)

# PHASE 4CP-AQ: validation-only workflow for the temporary CI branch. It runs
# the targeted Linux test matrix against the exact pushed commit. It performs
# NO deployment, NO release, NO publication, and references NO secrets.
# Least privilege: contents:read. Delete the temporary branch once validated.
# Failures are surfaced as ::error:: annotations (colour-stripped, targeted
# lines only) and all test logs are uploaded as a short-lived artifact.
# The tests themselves are NOT modified.

on:
  push:
    branches:
      - ci/linux-validation-4cp-ap-b609a25
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-validation:
    name: Linux targeted validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Versions
        if: always()
        run: |
          rustc --version
          cargo --version

      - name: node_identity unit tests
        if: always()
        run: |
          n=node_identity; log=/tmp/$n.log; set +e
          cargo test --lib node_identity:: 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: peer store tests
        if: always()
        run: |
          n=peer_store; log=/tmp/$n.log; set +e
          cargo test --lib phase4ak_peer_store_save_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: p2p suite
        if: always()
        run: |
          n=p2p; log=/tmp/$n.log; set +e
          cargo test --lib "p2p::" 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      # 4CP-AU: deterministic persistence-failure atomicity matrix (fault
      # injection seam, cfg(test) only). No continue-on-error: any failure
      # fails the step.
      - name: phase4au atomicity tests
        if: always()
        run: |
          n=phase4au; log=/tmp/$n.log; set +e
          cargo test --lib phase4au 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      # 4CP-AV: persistence-boundary recovery matrix (stop between row write
      # and ledger save, compensation failure keeping applied state, crafted
      # legacy images, all-or-nothing migration). No continue-on-error: any
      # failure fails the step.
      - name: phase4av recovery tests
        if: always()
        run: |
          n=phase4av; log=/tmp/$n.log; set +e
          cargo test --lib phase4av 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      # 4CP-AW: DAG determinism and conflict convergence through the real
      # acceptance funnel (arrival-order permutations, orphan ordering,
      # multi-source duplicates, conflict flips, cumulative overspend,
      # retained-loser descendants; all restart-stable). No
      # continue-on-error: any failure fails the step.
      - name: phase4aw convergence tests
        if: always()
        run: |
          n=phase4aw; log=/tmp/$n.log; set +e
          cargo test --lib phase4aw 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      # 4CP-AX: consensus-DAG selection robustness — activation-boundary
      # triples (CDW-1 / CDW / CDW+1, ts 0 and u64::MAX), 3+ candidate
      # conflicts, exact-work ties, incremental `tx.weight` vs independent
      # subtree-size reference, subtree-work vs independent closure
      # reference, winner independence from the weight field, persisted
      # rebuild (two deterministic orders) vs live state, loser-child
      # economics, multi-group permutations and restart fingerprints. No
      # continue-on-error: any failure fails the step.
      - name: phase4ax selection boundary tests
        if: always()
        run: |
          n=phase4ax; log=/tmp/$n.log; set +e
          cargo test --lib phase4ax 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done; fi
          exit "$c"

      - name: compile lib tests
        if: always()
        run: cargo test --lib --no-run

      - name: build lib
        if: always()
        run: cargo build --lib

      - name: build bins
        if: always()
        run: cargo build --bins

      - name: integration phase4aq_inventory_tests
        if: always()
        run: |
          n=phase4aq; log=/tmp/$n.log; set +e
          cargo test --test phase4aq_inventory_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      # 4CP-AR: repeat the restart/rebuild suite 20x. A single pass cannot
      # distinguish a fixed flake from a lucky one; any one of the 20 failing
      # fails the step (no continue-on-error, no masking).
      - name: integration phase4bz_restart_rebuild_tests (x20)
        if: always()
        run: |
          n=phase4bz; log=/tmp/$n.log; : > "$log"; set +e
          fails=0
          for i in $(seq 1 20); do
            echo "=== phase4bz run $i/20 ===" | tee -a "$log"
            cargo test --test phase4bz_restart_rebuild_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee -a "$log"
            c=${PIPESTATUS[0]}
            if [ "$c" -ne 0 ]; then
              fails=$((fails + 1))
              echo "::error::phase4bz run $i/20 failed on Linux (exit $c)"
            fi
          done
          if [ "$fails" -ne 0 ]; then
            echo "::error::phase4bz failed $fails/20 runs on Linux"
            grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "phase4bz: 20/20 runs passed"
          exit 0

      - name: integration phase4ca_twonode_sync_restart_tests
        if: always()
        run: |
          n=phase4ca; log=/tmp/$n.log; set +e
          cargo test --test phase4ca_twonode_sync_restart_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: integration phase4cb_lifecycle_restart_tests
        if: always()
        run: |
          n=phase4cb; log=/tmp/$n.log; set +e
          cargo test --test phase4cb_lifecycle_restart_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: integration phase4cc_adversarial_robustness_tests
        if: always()
        run: |
          n=phase4cc; log=/tmp/$n.log; set +e
          cargo test --test phase4cc_adversarial_robustness_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: integration phase4cd_peer_discovery_tests
        if: always()
        run: |
          n=phase4cd; log=/tmp/$n.log; set +e
          cargo test --test phase4cd_peer_discovery_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: integration phase4ce_peer_hygiene_tests
        if: always()
        run: |
          n=phase4ce; log=/tmp/$n.log; set +e
          cargo test --test phase4ce_peer_hygiene_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: integration phase4ch_pex_refresh_tests
        if: always()
        run: |
          n=phase4ch; log=/tmp/$n.log; set +e
          cargo test --test phase4ch_pex_refresh_tests 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: integration v6_preflight_manifest
        if: always()
        run: |
          n=v6_preflight_manifest; log=/tmp/$n.log; set +e
          cargo test --test v6_preflight_manifest 2>&1 | sed -r 's/\x1b\[[0-9;]*[mGKH]//g' | tee "$log"
          c=${PIPESTATUS[0]}
          if [ "$c" -ne 0 ]; then echo "::error::$n failed on Linux (exit $c)"; grep -aE "panicked at|FAILED|test result:|left ==|right ==|assertion|called .*unwrap|refusing|PermissionDenied|Err value|^error|could not compile" "$log" | tail -n 8 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit "$c"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-validation-logs
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 1
