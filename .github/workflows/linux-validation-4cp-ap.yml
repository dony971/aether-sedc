                  print(f"{label}: inconsistent counters in repetition {r.get('repetition')}", file=sys.stderr)
                  sys.exit(1)
              if r["transactions_rejected"] != 0 or r["latency_samples"] != 100:
                  print(f"{label}: rejected or missing samples in repetition {r.get('repetition')}", file=sys.stderr)
                  sys.exit(1)
          agg = aggs[0]
          if agg["transactions_applied"] != 300 or agg["latency_samples"] != 300:
              print(f"{label}: aggregate sample count is not 300", file=sys.stderr)
              sys.exit(1)
          print(f"{label}: schema v2 validated ({len(reps)} repetitions, {agg['latency_samples']} latency samples)")
          PY
